[package]
name = "two-free"
version = "0.1.1"
description = "2 Free desktop and mobile shell"
authors = ["2 Free"]
edition = "2021"

[lib]
name = "two_free_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
getrandom = "0.3"
hex = "0.4"
keyring = "4.1.5"
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0.0"
keyring-core = "1.0.0"
