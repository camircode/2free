services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: 2free_test
      POSTGRES_USER: 2free
      POSTGRES_PASSWORD: 2free
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U 2free -d 2free_test"]
      interval: 2s
      timeout: 3s
      retries: 15
